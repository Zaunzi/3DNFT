[profile.default]
src = "src"
test = "world-test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules"]
