<!doctype html><html><head><meta charset="UTF-8"><style>canvas{max-width:100%;height:auto!important}pre{white-space:pre-wrap}body{margin:16px}</style><title>Lil Ghosts renderer test</title></head><body style="background:#142b26;color:white;font:16px sans-serif"><h1>Lil Ghosts #1 · onchain SVG rendering test</h1><pre id="result">Testing…</pre><script type="module">
import * as THREE from 'three';
import {parseMetadata,loadSafeImage} from '../src/nfts/metadata.ts';
import {sanitizeSVG} from '../src/nfts/svg.ts';
import {NFTRepresentationRegistry,createNFTArtwork} from '../src/nfts/rendering.ts';
import fixture from './fixtures/lil-ghosts-1.json';
try {
 const bad=['<script>alert(1)<\/script>','<foreignObject><div>HTML</div></foreignObject>','<image href="https://evil.invalid/x"/>','<path onload="alert(1)"/>','<path style="fill:red"/>','<path fill="url(https://evil.invalid/x)"/>','<animate attributeName="x"/>','<use href="#x"/>'];
 for(const payload of bad){let rejected=false;try{sanitizeSVG(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">${payload}</svg>`);}catch{rejected=true;}if(!rejected)throw Error('Accepted hostile SVG: '+payload);}
 for(const source of ['<!DOCTYPE svg><svg/>','<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 0"/>','<svg xmlns="http://www.w3.org/2000/svg"><g></svg>']){let rejected=false;try{sanitizeSVG(source);}catch{rejected=true;}if(!rejected)throw Error('Accepted invalid SVG');}
 const metadata=parseMetadata(JSON.stringify(fixture),'https://ipfs.io/ipfs/');
 const bitmap=await loadSafeImage(metadata.image);if(bitmap.width!==512||bitmap.height!==512)throw Error('Unbounded texture');
 const pixels=document.createElement('canvas');pixels.width=pixels.height=512;const ctx=pixels.getContext('2d');ctx.drawImage(bitmap,0,0);const data=ctx.getImageData(0,0,512,512).data;let opaque=0;for(let i=3;i<data.length;i+=4)if(data[i])opaque++;if(opaque<100000)throw Error('Artwork missing');
 const scene=new THREE.Scene();scene.background=new THREE.Color('#142b26');scene.add(new THREE.HemisphereLight(0xffffff,0x555555,3));
 const registry=new NFTRepresentationRegistry();const asset={chainId:8453,contractAddress:'0x18808CE29BCC82a34953494F940Ba9E9216483C5',tokenId:1n};const pedestal=registry.create(asset,metadata);scene.add(pedestal);
 pedestal.add(createNFTArtwork(bitmap));
 const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(1.4,2.2,new URLSearchParams(location.search).has("rear")?-4.6:4.6);camera.lookAt(0,1.2,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(600,600);document.body.appendChild(renderer.domElement);renderer.render(scene,camera);
 document.querySelector('#result').textContent=`PASS: 11 hostile/invalid SVG cases rejected; actual onchain art decoded to 512×512 (${opaque} visible pixels) and rendered on the existing NFT pedestal.`;
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;throw e;}
</script></body></html>
